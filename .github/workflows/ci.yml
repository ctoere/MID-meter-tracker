name: CI

# The register feeds NEa filings, so the tests that matter are the ones that
# catch a silent reclassification: that no non-"No" seed can become None, that a
# CE mark alone never proposes Integrated, and that a status cannot be changed
# without a stated reason. Run them on every push and pull request.

on:
  # push is limited to main. A branch with an open PR is already covered by the
  # pull_request event, and listening to both ran every commit twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the README states. 3.12 and 3.13 are verified too.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Tesseract is deliberately NOT installed here. The intake has to degrade
      # with a clear message rather than crash when OCR is unavailable, and a
      # runner without it is the honest test of that.
      - name: Check the migration still reproduces the same classification
        run: python -m migrate.migrate_tracker --dry-run
